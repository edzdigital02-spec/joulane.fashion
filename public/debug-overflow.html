<!doctype html>
<meta charset="utf-8">
<title>Overflow Debug</title>
<style>
  body { margin: 0; font-family: monospace; white-space: pre-wrap; }
  iframe { width: 390px; height: 844px; border: 0; }
</style>
<iframe id="target" src="/"></iframe>
<script>
  const describe = (el) => {
    if (!el || !el.tagName) return '';
    let out = el.tagName.toLowerCase();
    if (el.id) out += `#${el.id}`;
    if (el.className && typeof el.className === 'string') {
      out += `.${el.className.trim().split(/\s+/).slice(0, 3).join('.')}`;
    }
    return out;
  };

  target.addEventListener('load', () => {
    setTimeout(() => {
      const doc = target.contentDocument;
      const win = target.contentWindow;
      const vw = doc.documentElement.clientWidth;
      const rows = [...doc.querySelectorAll('body *')]
        .map((el) => {
          const rect = el.getBoundingClientRect();
          return {
            el: describe(el),
            left: Math.round(rect.left),
            right: Math.round(rect.right),
            width: Math.round(rect.width),
            clientWidth: el.clientWidth,
            scrollWidth: el.scrollWidth,
            text: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 80)
          };
        })
        .filter((item) => (
          item.left < -1 ||
          item.right > vw + 1 ||
          item.width > vw + 1 ||
          item.scrollWidth > item.clientWidth + 1
        ))
        .sort((a, b) => (b.right - vw) - (a.right - vw))
        .slice(0, 40);

      document.body.innerHTML = `<pre>${JSON.stringify({
        viewport: vw,
        docScrollWidth: doc.documentElement.scrollWidth,
        bodyScrollWidth: doc.body.scrollWidth,
        scrollX: win.scrollX,
        rows
      }, null, 2)}</pre>`;
    }, 1000);
  });
</script>
